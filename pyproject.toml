[project]
name = "PyRobbo"
authors = [{ name = "Maciej Dems", email = "macdems@gmail.com" }]
description = "Clone of an old 8-bit Atari game Robbo"
readme = "README.md"
requires-python = ">=3"
license = { text = "GPL3" }
keywords = ["game", "pygame", "robbo", "atari", "clone"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment :: Arcade",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = ["pygame>=2.0.0", "PyYAML>=5.3.1", "appdirs>=1.4.4"]
dynamic = ["version"]

[project.urls]
Homepage = "http://github.com/macdems/pyrobbo"

[build-system]
requires = [
    "poetry-core>=2.0.0",
    "poetry-dynamic-versioning>=1.0.0,<2.0.0"
]
build-backend = "poetry_dynamic_versioning.backend"

[project.gui-scripts]
pyrobbo = "robbo:main"

[tool.poetry]
packages = [{ include = "robbo" }]
include = [
    { path = "robbo/sounds/*.wav", format = ["sdist", "wheel"] },
    { path = "robbo/levels/*.dat", format = ["sdist", "wheel"] },
    { path = "robbo/skins/*/*.png", format = ["sdist", "wheel"] },
    { path = "robbo/robbo.svg", format = ["sdist", "wheel"] },
    { path = "robbo/robbo.ico", format = ["sdist", "wheel"] },
]
version = "0.0.0"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
pattern = "default-unprefixed"
bump = true
